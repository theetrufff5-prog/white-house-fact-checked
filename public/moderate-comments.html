<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Comment Review | WH: Unchecked</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050608;color:#f5f5f3;font-family:Arial,sans-serif}main{max-width:960px;margin:auto;padding:70px 20px}h1{font-size:clamp(46px,8vw,84px);line-height:.9;text-transform:uppercase}h2{margin-top:0}.kicker{color:#f0443e;font:800 12px Consolas,monospace;letter-spacing:.12em}form,.item{margin:25px 0;padding:25px;background:#111318;border:1px solid #34373e}label{display:block;margin:15px 0;font:800 11px Consolas,monospace;letter-spacing:.07em;text-transform:uppercase}input,textarea{display:block;width:100%;margin-top:9px;padding:14px;background:#050608;border:1px solid #444851;color:#fff;font:16px Arial,sans-serif}textarea{resize:vertical}button{padding:13px 16px;background:#b20f18;border:0;color:#fff;font:800 11px Consolas,monospace;cursor:pointer}.secondary{background:#22262d;border:1px solid #444851}.meta,.actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:9px}.actions{justify-content:flex-start}.status{color:#75a7ef;font:800 10px Consolas,monospace;text-transform:uppercase}.flagged{color:#f0443e}.item small{color:#8e929a}.item p{line-height:1.65}.message{color:#8cb8f5;font:700 12px Consolas,monospace}</style></head><body><main><p class="kicker">/ PRIVATE EDITORIAL TOOL</p><h1>Comment review</h1><form data-login><label>Moderator password<input type="password" name="token" required autocomplete="current-password"></label><button type="submit">OPEN QUEUE</button></form><p class="message" data-message aria-live="polite"></p><form data-editorial hidden><h2>Post as WH: Unchecked Editorial Team</h2><label>Editorial reply<textarea name="body" maxlength="800" rows="4" required></textarea></label><button type="submit">PUBLISH REPLY</button></form><div data-list></div></main><script src="moderate-comments.js" defer></script></body></html>
