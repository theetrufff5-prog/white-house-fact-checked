name = "white-house-fact-checked"
main = "src/index.js"
compatibility_date = "2026-08-24"

routes = [
  { pattern = "whitehousefactchecked.com/*", zone_name = "whitehousefactchecked.com" },
  { pattern = "www.whitehousefactchecked.com/*", zone_name = "whitehousefactchecked.com" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "VISITOR_COUNTER"
class_name = "VisitCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitCounter"]
