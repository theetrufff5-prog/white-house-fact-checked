name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check public/community-comments.js
          node --check public/moderate-comments.js
      - name: Verify Cloudflare build
        run: npx wrangler deploy --dry-run
